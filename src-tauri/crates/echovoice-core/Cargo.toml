[package]
name = "echovoice-core"
version = "0.1.0"
edition = "2021"
description = "Platform independent audio primitives for EchoVoice (mixer, DSP, decoding, config)"
license = "MIT"

# No wasapi / tauri / windows-sys here on purpose: this crate must compile and be
# testable on every host platform so the real-time DSP logic can be unit tested.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rubato = "0.14"
symphonia = { version = "0.5", features = ["all"] }
bytemuck = "1.25.0"
tracing = "0.1"
